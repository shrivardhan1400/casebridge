<script>
const $=s=>document.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEMO={en:"I rented a house in May and paid thirty thousand rupees as a deposit. I moved out in August, but the landlord has not returned the deposit.",te:"నేను మేలో ఇల్లు అద్దెకు తీసుకుని డిపాజిట్‌గా ముప్పై వేల రూపాయలు ఇచ్చాను. ఆగస్టులో ఖాళీ చేశాను, కానీ యజమాని డిపాజిట్ తిరిగి ఇవ్వలేదు."};
const SRC={statement:'🎙 Your statement',document:'📄 Uploaded document',manual:'⌨ Manually entered'};
let uid=0;const F=(value,o={})=>({id:'f'+ ++uid,value,sourceType:'statement',sourceId:'story',status:'review',confidence:.9,originalText:value,...o});
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ===== SERVICES (mock). Swap bodies for real APIs later; UI only calls these. ===== */
const aiService={async extract(text,lang){await wait(300);
 // REAL INTEGRATION: send transcript to an LLM with a JSON schema; require verbatim originalText spans and never infer years.
 if(!text.trim())throw new Error('empty');
 const t=lang==='te'?DEMO.en:text; // mock: Telugu demo text maps to the English demo extraction
 const dates=MONTHS.filter(m=>new RegExp(m,'i').test(t)).sort((a,b)=>t.search(new RegExp(a,'i'))-t.search(new RegExp(b,'i'))).map(m=>F(m,{note:'year not specified',interp:m+' of the current year'}));
 return{people:[F('Tenant (you)'),...(/landlord/i.test(t)?[F('Landlord')]:[])],
  amounts:/thirty thousand|30,?000/i.test(t)?[F('₹30,000',{originalText:'thirty thousand rupees'})]:[],dates,
  events:[/rent/i.test(t)&&F('Agreement signed',{originalText:'rented a house',dateRef:dates[0]?.id,grp:0}),/deposit|paid/i.test(t)&&F('Deposit paid',{originalText:'paid',dateRef:dates[0]?.id,grp:0}),/moved out/i.test(t)&&F('Property vacated',{originalText:'moved out',dateRef:dates[1]?.id,grp:1}),/not returned|hasn't returned/i.test(t)&&F('Refund requested',{originalText:'has not returned the deposit',confidence:.6,note:'date not specified',grp:2})].filter(Boolean)}}};
const documentService={async analyze(file,kind){await wait(1500);
 // REAL INTEGRATION: run OCR + document-type classification; return values with bounding boxes and confidence.
 if(!/\.(pdf|png|jpe?g)$/i.test(file.name))throw new Error('file');
 if(/blur|fail/i.test(file.name))throw new Error('ocr');
 const k=kind||(/\.pdf$/i.test(file.name)?'agreement':'receipt'),fid=()=>'d'+ ++uid;
 if(k==='agreement')return{kind:k,fields:[{id:fid(),label:'Document type',value:scen()==='rental'?'Rental agreement':'Agreement or written terms',conf:.9},{id:fid(),label:'Month',value:'May',conf:.85}]};
 if(k==='bank')return{kind:k,fields:[{id:fid(),label:'Amount',value:'₹25,000',conf:.93},{id:fid(),label:'Date',value:'04/05',conf:.9}]};
 if(k==='other')return{kind:k,fields:[{id:fid(),label:'Content',value:'No amounts or dates extracted',conf:.9}]};
 return{kind:k,fields:[{id:fid(),label:'Amount',value:'₹25,000',conf:.96,region:'amount'},{id:fid(),label:'Date',value:'04/05',conf:.48,region:'date',note:'Could be 4 May or 5 April.'}]}}};
const caseService={create:()=>({id:'INT-1042',createdAt:new Date().toISOString(),language:'en',transcript:'',people:[],amounts:[],dates:[],events:[],documents:[],clarifications:[],removed:[],incStory:true,status:'draft',answers:{},followUps:[],review:'none',closed:false,chat:[],log:[],maxv:0}),
 diff(c){const a=c.amounts[0],b=c.documents.flatMap(d=>(d.fields||[]).filter(f=>f.label==='Amount').map(f=>({...f,doc:d.name})))[0];
  return a&&b&&a.value.replace(/\D/g,'')!==b.value.replace(/\D/g,'')?{a,b}:null}};

/* ===== STATE ===== */
const S={skip:{},fail:{},slot:null,v:'home',lang:'en',mode:'type',demo:false,tx:'',rec:{on:false},C:caseService.create(),clar:null,doc:null,hl:null,sel:null,err:null,ferr:null,stage:0};
let C=S.C,TI,R;
const go=v=>{const t=VSTAGE[v];if(t&&hasStory()){const c=getCurrentCaseStage();if(t>c+1+((c===3&&!hasDiff())?1:0)){v=STG_VIEW[Math.min(c,7)];toast('Let’s take this step by step — continuing where you left off.')}else C.maxv=Math.max(C.maxv||0,t)}S.v=v;S.err=null;render();scrollTo(0,0)};
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
const toast=m=>{const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:10px;z-index:9;font-size:.85rem';document.body.append(d);setTimeout(()=>d.remove(),2200)};
const undoToast=(m,fn)=>{const d=document.createElement('div');d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:10px;z-index:9;font-size:.85rem;max-width:90vw';d.textContent=m;const b=document.createElement('button');b.textContent='Undo';b.style.cssText='text-decoration:underline;margin-left:.75rem;font-weight:600';b.onclick=()=>{fn();d.remove()};d.append(b);document.body.append(d);setTimeout(()=>d.remove(),7000)};
const money=()=>{const c=S.clar,d=caseService.diff(C),a=C.amounts[0];
 if(!a)return{main:null,none:true,un:false,bd:[]};if(!d)return{main:a.value,un:a.status!=='confirmed',bd:[]};

 if(/why.*(ask|need|document|question|this)/.test(q)){if(S.v==='info'&&openQs()[0])return'We ask this because it '+openQs()[0][2].toLowerCase().replace(/\.$/,'')+'. You can skip it.';if(S.v==='docs')return'Suggested documents are based on what you told us. '+g.filter(x=>x.tier==='rec').map(x=>x.name+': '+x.why).join(' ')+' None are required by CaseBridge.';return STG_EX[Math.min(s,7)]}
 if(/(what is|what.?s) this step|where am i|which step/.test(q))return s>=8?'Your workflow is marked complete. You can reopen it from the Follow-up step.':`You’re at step ${s+1} of 8 — ${STG[s]}. ${STG_EX[s]}`;
 if(/next|what should i do|what now|continue/.test(q))return'Your next step: '+n.t+' (“'+n.b.replace(' →','')+'”)'+(o.length>1?'\n\nAlso outstanding: '+o.slice(0,3).join('; ')+'.':'');
 if(/missing|still need|outstanding|left to do/.test(q))return o.length?'Still outstanding:\n• '+o.slice(0,6).join('\n• ')+'\nYou can skip any of these and continue.':'Nothing is outstanding right now.';
 if(/document|upload/.test(q))return'Documents that may help (none are legally required):\n'+g.map(x=>'• '+x.name+' — '+({rec:'recommended',use:'useful if available',opt:'optional'}[x.tier])+'. '+x.why).join('\n')+(C.documents.length?'\n\nYou’ve added '+pl2(C.documents.length,'document')+'.':'');

function chatRender(){const m=$('#cbm');if(!m)return;const L=C.chat.length?C.chat:[{r:'a',t:'I can explain this step, your recorded information, documents, clarifications, or what you can do next. I’m not a lawyer and can’t give legal advice.'}];m.innerHTML=L.map(x=>`<div class="cm ${x.r}">${esc(x.t).replace(/\n/g,'<br>')}</div>`).join('');m.scrollTop=m.scrollHeight;$('#cbq').innerHTML=QA.map((q,i)=>`<button class="btn-g" onclick="chatAsk(QA[${i}])">${q}</button>`).join('');$('#cbx').textContent=hasStory()?'Step '+Math.min(getCurrentCaseStage()+1,8)+' · '+(getCurrentCaseStage()>=8?'complete':STG[getCurrentCaseStage()]):'No story yet';$('#cbp').hidden=!S.chatOpen;$('#cbt').setAttribute('aria-expanded',!!S.chatOpen);$('#cbt').classList.toggle('nu',!S.chatOpen&&!!S.unread)}
function chatOpen(v){S.chatOpen=!!v;if(v)S.unread=0;chatRender();if(v)setTimeout(()=>$('#cbi').focus(),30)}
function chatNote(t){C.chat.push({r:'a',t});if(!S.chatOpen)S.unread=1;chatRender()}
function chatAsk(t){t=String(t||'').trim();if(!t)return;C.chat.push({r:'u',t});C.chat.push({r:'a',t:chatAnswer(t)});chatRender()}
const cb=document.createElement('div');cb.id='cb';cb.className='np';cb.innerHTML='<button id="cbt" class="btn" aria-label="Ask CaseBridge" aria-expanded="false" aria-controls="cbp" onclick="chatOpen(!S.chatOpen)">💬 Ask CaseBridge</button><div id="cbp" role="dialog" aria-label="Ask CaseBridge" hidden><div class="cbh"><div><b>ASK CASEBRIDGE</b><div id="cbx" class="text-xs t-m"></div></div><button class="btn-g" aria-label="Close chat" onclick="chatOpen(0)">✕</button></div><div id="cbm" aria-live="polite"></div><div id="cbq"></div><form onsubmit="chatAsk($(\'#cbi\').value);$(\'#cbi\').value=\'\';return false"><input id="cbi" class="inp" aria-label="Ask a question" placeholder="Ask about this step, your information, documents…" autocomplete="off"><button class="btn" type="submit">Send</button></form><p class="text-xs t-m" style="padding:0 .8rem .6rem">Not a lawyer. Can’t give legal advice or judge what is true. Runs in this prototype only.</p></div>';document.body.appendChild(cb);
